spring.application.name=mdd-api
server.port=8080

# Datasource (valeurs par défaut = docker-compose ; surchargeables via env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mdd?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mdd}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mdd_secret}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ORM : le schéma est créé / mis à jour depuis les entités JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false

# CORS (front Angular local)
app.cors.allowed-origins=http://localhost:4200
