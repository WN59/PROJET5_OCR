<div class="page">
  <img src="/assets/logo_p6.png" alt="Logo MDD" class="logo" />
  <h1>MDD — Monde de Dév</h1>
  <p class="subtitle">Feature/4 : première action front → API → MySQL</p>

  <button
    mat-raised-button
    color="primary"
    (click)="start()"
    [disabled]="loading"
  >
    {{ loading ? 'Chargement…' : 'Charger les thèmes' }}
  </button>

  <p class="error" *ngIf="error">{{ error }}</p>

  <section class="topics" *ngIf="loaded && !error">
    <h2>Thèmes ({{ topics.length }})</h2>
    <ul *ngIf="topics.length; else empty">
      <li *ngFor="let topic of topics">
        <strong>{{ topic.name }}</strong>
        <span>{{ topic.description }}</span>
      </li>
    </ul>
    <ng-template #empty>
      <p>Aucun thème en base.</p>
    </ng-template>
  </section>
</div>
